<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" rx="8" fill="#2b2d30"/>
  <!-- title bar -->
  <rect width="760" height="34" rx="8" fill="#1e1f22"/>
  <text x="16" y="22" fill="#dfe1e5" font-weight="600">Settings</text>
  <!-- left nav -->
  <rect x="0" y="34" width="190" height="326" fill="#27282b"/>
  <rect x="10" y="46" width="170" height="26" rx="4" fill="#1e1f22" stroke="#4e5157"/>
  <text x="20" y="63" fill="#868a91">🔍 plugins</text>
  <text x="20" y="98" fill="#dfe1e5">Appearance &amp; Behavior</text>
  <text x="20" y="122" fill="#dfe1e5">Keymap</text>
  <text x="20" y="146" fill="#dfe1e5">Editor</text>
  <rect x="8" y="156" width="174" height="24" rx="4" fill="#2e436e"/>
  <text x="20" y="172" fill="#ffffff" font-weight="600">Plugins</text>
  <text x="20" y="200" fill="#dfe1e5">Version Control</text>
  <text x="20" y="224" fill="#dfe1e5">Build, Execution, Deployment</text>
  <text x="20" y="248" fill="#dfe1e5">Tools</text>
  <!-- tabs -->
  <text x="214" y="64" fill="#868a91">Marketplace</text>
  <text x="314" y="64" fill="#dfe1e5" font-weight="600">Installed</text>
  <rect x="310" y="70" width="66" height="2" fill="#3574f0"/>
  <!-- gear -->
  <rect x="700" y="46" width="30" height="26" rx="4" fill="#3d4044" stroke="#f0a732" stroke-width="2"/>
  <text x="708" y="64" fill="#dfe1e5" font-size="15">⚙</text>
  <text x="690" y="96" fill="#f0a732" font-size="12" text-anchor="end">① dişli simgesi</text>
  <!-- dropdown -->
  <rect x="470" y="104" width="270" height="150" rx="6" fill="#1e1f22" stroke="#4e5157"/>
  <text x="486" y="130" fill="#dfe1e5">Manage Plugin Repositories…</text>
  <text x="486" y="156" fill="#dfe1e5">HTTP Proxy Settings…</text>
  <line x1="480" y1="168" x2="730" y2="168" stroke="#4e5157"/>
  <text x="486" y="190" fill="#dfe1e5">Manage Plugin Certificates</text>
  <rect x="476" y="200" width="258" height="26" rx="4" fill="#2e436e" stroke="#f0a732" stroke-width="2"/>
  <text x="486" y="218" fill="#ffffff" font-weight="600">Install Plugin from Disk…</text>
  <text x="486" y="246" fill="#dfe1e5">Disable All Downloaded Plugins</text>
  <text x="470" y="276" fill="#f0a732" font-size="12">② "Install Plugin from Disk…" → plugins/*.zip seçin</text>
  <!-- installed list -->
  <rect x="210" y="90" width="240" height="44" rx="4" fill="#323438"/>
  <text x="222" y="110" fill="#dfe1e5" font-weight="600">SpotBugs</text>
  <text x="222" y="126" fill="#868a91" font-size="11">1.2.8 · Downloaded</text>
  <rect x="210" y="140" width="240" height="44" rx="4" fill="#323438"/>
  <text x="222" y="160" fill="#dfe1e5" font-weight="600">PMD</text>
  <text x="222" y="176" fill="#868a91" font-size="11">2.1.0 · Downloaded</text>
  <rect x="210" y="190" width="240" height="44" rx="4" fill="#323438"/>
  <text x="222" y="210" fill="#dfe1e5" font-weight="600">SonarQube for IDE</text>
  <text x="222" y="226" fill="#868a91" font-size="11">13.3.0 · Downloaded</text>
  <!-- restart button -->
  <rect x="210" y="300" width="130" height="30" rx="5" fill="#3574f0"/>
  <text x="275" y="320" fill="#ffffff" font-weight="600" text-anchor="middle">Restart IDE</text>
  <text x="352" y="320" fill="#f0a732" font-size="12">③ tüm eklentiler eklendikten sonra yeniden başlatın</text>
</svg>
